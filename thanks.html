<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Thank you · TMCanvas</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .thanks-main { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
      .thanks-card { width: 100%; max-width: 38rem; padding: clamp(1.5rem, 5vw, 3rem); }
      .thanks-card h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 1rem 0; }
      .thanks-card p { margin-bottom: 1.5rem; }
    </style>
  </head>
  <body class="gradient-mesh">
    <main class="thanks-main">
      <section class="card thanks-card shadow-soft" aria-labelledby="thanks-title">
        <p class="logo-title">TMCanvas</p>
        <h1 id="thanks-title">Thanks for reaching out!</h1>
        <p>Your message has been submitted. I look forward to learning more about your project.</p>
        <a href="./#top" class="btn btn-primary">Back to my portfolio</a>
      </section>
    </main>
  </body>
</html>
